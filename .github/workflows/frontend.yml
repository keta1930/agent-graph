name: Frontend Quality

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'agent_graph/app/**'
      - 'tests/contracts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/frontend.yml'
  push:
    branches: [master, main]
    paths:
      - 'frontend/**'
      - 'agent_graph/app/**'
      - 'tests/contracts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.9.29
      - name: Install production SSE contract dependencies
        working-directory: .
        run: uv sync --locked
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
